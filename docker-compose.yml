services:
  postgres:
    # 固定 PostgreSQL 17 + pgvector；第一阶段只使用精确余弦检索，不建 HNSW/IVFFlat。
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: legal_rag
      POSTGRES_USER: legal_rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_rag -d legal_rag"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    # Celery 5.5/Kombu 5.5 的 pidbox 仍会声明临时非独占队列；
    # RabbitMQ 4.3 起默认拒绝该队列类型，因此固定在兼容的 4.2 系列。
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: legal_rag
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 配置 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data-v42:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: [.env]
    environment: &app-env
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: legal_rag
      DB_USER: legal_rag
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: legal_rag
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      INIT_USERNAME: ${INIT_USERNAME:-admin}
      INIT_PASSWORD: ${INIT_PASSWORD:?请在 .env 配置 INIT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 配置至少 32 位的 JWT_SECRET}
      RUN_MIGRATIONS: "1"
      VECTOR_BACKEND: pgvector
    volumes:
      - rag-data:/app/data
      - rag-models:/app/models
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 首次启动可能需要下载 embedding 并构建索引，避免尚未监听端口时
      # 被过早判定为 unhealthy，从而阻塞 worker 启动。
      start_period: 10m
    restart: unless-stopped

  worker:
    build: .
    command: ["celery", "-A", "backend.app.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--pool=threads", "--concurrency=${WORKER_CONCURRENCY:-2}"]
    env_file: [.env]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
      VECTOR_BACKEND: pgvector
    volumes:
      - rag-data:/app/data
      - rag-models:/app/models
    expose: ["9101"]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.app.worker.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data-v42:
  redis-data:
  rag-data:
  rag-models:
